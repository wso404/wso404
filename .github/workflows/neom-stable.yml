name: Stable Manual Build
permissions:
  contents: read
concurrency:
  group: stable-manual-build
  cancel-in-progress: false
jobs:
  build:
    name: Build ROM
    if: ${{ github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      INPUT_URL: ${{ inputs.input_url }}
      VENDOR_ODM_URL: ${{ inputs.vendor_odm_url }}
      REPO_NAME: ${{ github.repository }}
      ROM_LINK: ${{ inputs.input_url }}
      ROM_PREFIX: xiaomi
      BUILDER_NAME: ${{ github.actor }}
      BUILDER_ID: ''
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
      RCLONE_REMOTE_NAME: ${{ secrets.RCLONE_REMOTE_NAME }}
      RCLONE_UPLOAD_DIR: ${{ secrets.RCLONE_UPLOAD_DIR }}
      RCLONE_PUBLIC_LINK_BASE: ${{ secrets.RCLONE_PUBLIC_LINK_BASE }}
      TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
    steps:
    - name: Initialize private logs and load private logging utility
      id: init_logs
      env:
        ENGINE_READ_TOKEN: ${{ secrets.ENGINE_READ_TOKEN }}
        ENGINE_REPO: ${{ secrets.ENGINE_REPO }}
      run: |
        set -euo pipefail
        umask 077
        export NEOM_LOG_DIR="$RUNNER_TEMP/neom-private-logs"
        export NEOM_PRIVATE_LOG_DIR="$NEOM_LOG_DIR"
        export NEOM_CI_HELPER="$RUNNER_TEMP/neom-private-ci.py"
        mkdir -p "$NEOM_LOG_DIR"
        {
          echo "NEOM_LOG_DIR=$NEOM_LOG_DIR"
          echo "NEOM_PRIVATE_LOG_DIR=$NEOM_PRIVATE_LOG_DIR"
          echo "NEOM_CI_HELPER=$NEOM_CI_HELPER"
        } >> "$GITHUB_ENV"
        python3 <<'PY'
        import os
        from pathlib import Path
        import re
        import sys
        import traceback
        import urllib.error
        import urllib.request
        log = Path(os.environ['NEOM_LOG_DIR']) / 'bootstrap.log'
        try:
            repo = os.environ.get('ENGINE_REPO', '')
            token = os.environ.get('ENGINE_READ_TOKEN', '')
            if not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', repo):
                raise ValueError('ENGINE_REPO must be owner/repo')
            if not token:
                raise ValueError('ENGINE_READ_TOKEN is missing')
            url = 'https://api.github.com/repos/' + repo + '/contents/bin/ci/private_ci.py?ref=main'
            request = urllib.request.Request(url, headers={
                'Authorization': 'Bearer ' + token,
                'Accept': 'application/vnd.github.raw+json',
                'X-GitHub-Api-Version': '2022-11-28',
                'User-Agent': 'Neom-private-ci'})
            with urllib.request.urlopen(request, timeout=60) as response:
                source = response.read(1024 * 1024)
            compile(source, '<private-ci>', 'exec')
            helper = Path(os.environ['NEOM_CI_HELPER'])
            helper.write_bytes(source)
            helper.chmod(0o600)
            log.write_text('Private logging utility loaded from the engine repository.\n')
        except Exception as error:
            detail = traceback.format_exc()
            if isinstance(error, urllib.error.HTTPError):
                detail += '\nGitHub API response:\n' + error.read(16384).decode(errors='replace')
            for name, value in os.environ.items():
                if value and name.endswith(('_TOKEN', '_SECRET', '_PASSWORD', '_CONFIG_B64')):
                    detail = detail.replace(value, '[REDACTED]')
            log.write_text(detail)
            print('::error::Private logging setup failed. Diagnostics will be sent to your Telegram account.')
            sys.exit(1)
        PY
        python3 "$NEOM_CI_HELPER" init
    - name: Maximize available build space
      uses: easimon/maximize-build-space@fc881a613ad2a34aca9c9624518214ebc21dfc0c
      with:
        swap-size-mb: 1024
        root-reserve-mb: 512
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'
      id: space
    - name: Validate configuration
      env:
        ENGINE_READ_TOKEN: ${{ secrets.ENGINE_READ_TOKEN }}
        ENGINE_REPO: ${{ secrets.ENGINE_REPO }}
        RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
      run: |
        python3 "$NEOM_CI_HELPER" run validate -- bash -e -u -o pipefail <<'NEOM_PRIVATE_STAGE'
        set -euo pipefail
        [[ -n "$ENGINE_REPO" ]] || { echo "::error::Missing ENGINE_REPO"; exit 1; }
        [[ -n "$ENGINE_READ_TOKEN" ]] || {
          echo "::error::Missing ENGINE_READ_TOKEN"; exit 1;
        }
        [[ -n "$RCLONE_CONFIG_B64" ]] || {
          echo "::error::Missing RCLONE_CONFIG_B64"; exit 1;
        }
        [[ -n "$RCLONE_REMOTE_NAME" ]] || {
          echo "::error::Missing RCLONE_REMOTE_NAME"; exit 1;
        }
        [[ -n "$RCLONE_UPLOAD_DIR" ]] || {
          echo "::error::Missing RCLONE_UPLOAD_DIR"; exit 1;
        }
        [[ "$INPUT_URL" == https://* ]] || {
          echo "::error::The ROM URL must start with https://"; exit 1;
        }
        [[ "$VENDOR_ODM_URL" == https://* ]] || {
          echo "::error::vendor_odm.zip URL must start with https://"; exit 1;
        }
        if [[ -n "${TELEGRAM_CHANNEL_ID:-}" && ! "$TELEGRAM_CHANNEL_ID" =~ ^[1-9][0-9]*$ ]]; then
          echo "::error::TELEGRAM_OWNER_ID must be your positive numeric personal Telegram ID."
          exit 1
        fi
        if [[ -z "${TELEGRAM_BOT_TOKEN:-}" || -z "${TELEGRAM_CHANNEL_ID:-}" ]]; then
          echo "::error::TELEGRAM_BOT_TOKEN and TELEGRAM_OWNER_ID are required for private logs."
          exit 1
        fi
        NEOM_PRIVATE_STAGE
      id: validate
    - name: Checkout source privately
      id: checkout_engine
      env:
        ENGINE_READ_TOKEN: ${{ secrets.ENGINE_READ_TOKEN }}
        ENGINE_REPO: ${{ secrets.ENGINE_REPO }}
      run: |
        python3 "$NEOM_CI_HELPER" run checkout -- python3 "$NEOM_CI_HELPER" checkout "$GITHUB_WORKSPACE/engine"
    - name: Prepare tools
      working-directory: engine
      run: |
        python3 "$NEOM_CI_HELPER" run prepare -- bash -e -u -o pipefail <<'NEOM_PRIVATE_STAGE'
        set -euo pipefail
        for required in build.sh functions.sh packROM.sh uploadROM.sh notify.py; do
          [[ -f "$required" ]] || {
            echo "::error::A required file is missing."
            exit 1
          }
        done
        [[ -d bin/Linux/x86_64 ]] || {
          echo "::error::Required tools were not found."
          exit 1
        }
        find bin/Linux/x86_64 -maxdepth 1 -type f -exec chmod +x {} +
        find bin -type f -name '*.sh' -exec chmod +x {} +
        chmod +x build.sh packROM.sh uploadROM.sh
        echo "Source checkout completed."
        df -h .
        NEOM_PRIVATE_STAGE
      id: prepare
    - name: Install Java 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
      id: java
    - name: Install build dependencies
      run: |
        python3 "$NEOM_CI_HELPER" run dependencies -- bash -e -u -o pipefail <<'NEOM_PRIVATE_STAGE'
        set -euo pipefail
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          aria2 jq rclone sshpass python-is-python3 wget python3 \
          lz4 xz-utils zlib1g-dev gcc g++ libc6 libstdc++6 \
          python3-pip dialog aapt busybox zip erofs-utils erofsfuse \
          unzip p7zip-full zipalign zstd bc android-sdk-libsparse-utils xmlstarlet
        sudo pip3 install --break-system-packages --no-cache-dir \
          ConfigObj telebot setuptools requests gdown==5.2.0 || \
          sudo pip3 install --no-cache-dir ConfigObj telebot setuptools requests gdown==5.2.0
        NEOM_PRIVATE_STAGE
      id: dependencies
    - name: Check free disk space
      run: |
        python3 "$NEOM_CI_HELPER" run disk -- bash -e -u -o pipefail <<'NEOM_PRIVATE_STAGE'
        set -euo pipefail
        df -h "$GITHUB_WORKSPACE"
        echo "::notice::Very large ROMs may require more disk space than the standard runner provides."
        NEOM_PRIVATE_STAGE
      id: disk
    - name: Load upload configuration
      working-directory: engine
      env:
        RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
      run: |
        python3 "$NEOM_CI_HELPER" run drive_config -- bash -e -u -o pipefail <<'NEOM_PRIVATE_STAGE'
        set -euo pipefail
        umask 077
        if ! printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > rclone.conf; then
          rm -f rclone.conf
          echo "::error::Could not decode RCLONE_CONFIG_B64."
          exit 1
        fi
        chmod 600 rclone.conf
        [[ -s rclone.conf ]] || {
          echo "::error::Decoded Drive configuration is empty."
          exit 1
        }
        unset RCLONE_CONFIG_B64
        echo "Upload configuration loaded."
        NEOM_PRIVATE_STAGE
      id: drive_config
    - name: Check Drive configuration and authentication privately
      id: drive_check
      working-directory: engine
      run: |
        python3 "$NEOM_CI_HELPER" run drive-check -- python3 "$NEOM_CI_HELPER" check-drive "$PWD/rclone.conf"
    - name: Send build notification
      working-directory: engine
      run: |
        python3 "$NEOM_CI_HELPER" run notify_start -- bash -e -u -o pipefail <<'NEOM_PRIVATE_STAGE'
        python3 notify.py start \
          "$REPO_NAME" "$ROM_LINK" "$ROM_PREFIX" \
          "$BUILDER_NAME" "$BUILDER_ID" || true
        NEOM_PRIVATE_STAGE
      id: notify_start
    - name: Download extract and modify ROM
      working-directory: engine
      run: |
        python3 "$NEOM_CI_HELPER" run build -- bash -e -u -o pipefail <<'NEOM_PRIVATE_STAGE'
        set -euo pipefail
        if sudo -E bash build.sh \
            "$INPUT_URL" "$REPO_NAME" "$ROM_PREFIX" \
            "$BUILDER_NAME" "$BUILDER_ID" \
            2>&1 | tee "$NEOM_LOG_DIR/build-output.log"; then
          echo "ROM extraction and modification stage finished."
        else
          if grep -Fq 'No space left on device' "$NEOM_LOG_DIR/build-output.log"; then
            echo "::error::Disk capacity exhausted while extracting the ROM."
          elif grep -Fq 'Unpacking payload.bin failed' "$NEOM_LOG_DIR/build-output.log"; then
            echo "::error::The payload.bin extraction stage failed."
          else
            echo "::error::Download, extraction or modification failed."
          fi
          df -h . || true
          exit 1
        fi
        df -h .
        NEOM_PRIVATE_STAGE
      id: build
    - name: Repack ROM
      working-directory: engine
      run: |
        python3 "$NEOM_CI_HELPER" run pack -- bash -e -u -o pipefail <<'NEOM_PRIVATE_STAGE'
        set -euo pipefail
        python3 notify.py pack \
          "$REPO_NAME" "$ROM_LINK" "$ROM_PREFIX" \
          "$BUILDER_NAME" "$BUILDER_ID" || true
        if sudo -E bash packROM.sh 2>&1 | tee "$NEOM_LOG_DIR/pack-output.log"; then
          echo "ROM repacking stage finished."
        else
          if grep -Fq 'No space left on device' "$NEOM_LOG_DIR/pack-output.log"; then
            echo "::error::Disk capacity exhausted while repacking the ROM."
          else
            echo "::error::Repacking failed."
          fi
          df -h . || true
          exit 1
        fi
        NEOM_PRIVATE_STAGE
      id: pack
    - name: Verify generated ROM ZIP
      working-directory: engine
      run: |
        python3 "$NEOM_CI_HELPER" run verify_zip -- bash -e -u -o pipefail <<'NEOM_PRIVATE_STAGE'
        set -euo pipefail
        [[ -s bin/ddevice/output_zip.txt ]] || {
          echo "::error::packROM.sh did not create an output ZIP record."
          exit 1
        }
        zip_name="$(tr -d '\r\n' < bin/ddevice/output_zip.txt)"
        [[ -n "$zip_name" && "$zip_name" == "$(basename "$zip_name")" ]] || {
          echo "::error::The generated ZIP filename is invalid."
          exit 1
        }
        [[ -s "out/$zip_name" ]] || {
          echo "::error::The generated ZIP is missing or empty."
          exit 1
        }
        echo "ROM ZIP generated successfully. Size: $(stat -c '%s' "out/$zip_name") bytes."
        echo "Output saved for cloud upload."
        NEOM_PRIVATE_STAGE
      id: verify_zip
    - name: Upload ROM to Google Drive
      working-directory: engine
      run: |
        python3 "$NEOM_CI_HELPER" run upload -- bash -e -u -o pipefail <<'NEOM_PRIVATE_STAGE'
        set -euo pipefail
        python3 notify.py upload \
          "$REPO_NAME" "$ROM_LINK" "$ROM_PREFIX" \
          "$BUILDER_NAME" "$BUILDER_ID" || true
        if sudo -E bash uploadROM.sh 2>&1 | tee "$NEOM_LOG_DIR/upload-output.log"; then
          echo "Drive upload and original verification completed."
        else
          if ! grep -Fq 'Upload complete:' "$NEOM_LOG_DIR/upload-output.log" || \
             ! grep -Fq 'Upload verification FAILED:' "$NEOM_LOG_DIR/upload-output.log"; then
            echo "::error::Google Drive transfer failed."
            exit 1
          fi
          echo "::warning::Original upload verifier failed; checking the cloud copy independently."
          zip_name="$(tr -d '\r\n' < bin/ddevice/output_zip.txt)"
          zip_size="$(stat -c '%s' "out/$zip_name")"
          device_code="$(tr -d '\r\n' < bin/ddevice/device_code.txt)"
          [[ "$device_code" != *'/'* && -n "$device_code" ]] || exit 1
          remote_root="${RCLONE_REMOTE_NAME}:${RCLONE_UPLOAD_DIR%/}/Stable/${device_code}/"
          if ! sudo -E rclone --config="$PWD/rclone.conf" lsjson \
              --files-only --no-modtime --recursive "$remote_root" \
              > "$NEOM_LOG_DIR/remote-index.json" 2> "$NEOM_LOG_DIR/remote-errors.log"; then
            echo "::error::Could not list uploaded files for independent verification."
            exit 1
          fi
          export NEOM_EXPECTED_ZIP_NAME="$zip_name" NEOM_EXPECTED_ZIP_SIZE="$zip_size"
          matched_path="$(python3 - "$NEOM_LOG_DIR/remote-index.json" <<'PY'
        import json
        import os
        import sys
        with open(sys.argv[1], encoding='utf-8') as stream:
            entries = json.load(stream)
        target_name = os.environ['NEOM_EXPECTED_ZIP_NAME']
        target_size = int(os.environ['NEOM_EXPECTED_ZIP_SIZE'])
        candidates = [entry['Path'] for entry in entries
                      if isinstance(entry, dict)
                      and entry.get('Name') == target_name
                      and entry.get('Size') == target_size
                      and entry.get('Path')]
        if len(candidates) != 1:
            sys.exit(1)
        print(candidates[0])
        PY
          )" || {
            echo "::error::The Google Drive file name and size could not be verified."
            exit 1
          }
          remote_file="${remote_root}${matched_path}"
          link="$(sudo -E rclone --config="$PWD/rclone.conf" link "$remote_file" 2>> "$NEOM_LOG_DIR/remote-errors.log" | tail -n 1 | tr -d '\r' || true)"
          {
            echo "NEOM_UPLOAD_VERIFIED=1"
            if [[ "$link" == https://* ]]; then
              echo "NEOM_GOOGLE_DRIVE_URL=$link"
            fi
          } >> "$GITHUB_ENV"
          if [[ "$link" == https://* ]]; then
            echo "::add-mask::$link"
          fi
          echo "The uploaded ROM is independently verified by filename and size."
        fi
        NEOM_PRIVATE_STAGE
      id: upload
    - name: Send success notification
      if: success()
      run: |
        python3 "$NEOM_CI_HELPER" run notify_success -- bash -e -u -o pipefail <<'NEOM_PRIVATE_STAGE'
        if [[ -f "$GITHUB_WORKSPACE/engine/notify.py" ]]; then
          cd "$GITHUB_WORKSPACE/engine"
          python3 notify.py success "$REPO_NAME" "$ROM_LINK" "$ROM_PREFIX" "$BUILDER_NAME" "$BUILDER_ID" || true
        fi
        NEOM_PRIVATE_STAGE
      id: notify_success
    - name: Send failure notification
      if: ${{ failure() && steps.init_logs.outcome == 'success' }}
      run: |
        python3 "$NEOM_CI_HELPER" run notify_fail -- bash -e -u -o pipefail <<'NEOM_PRIVATE_STAGE'
        if [[ -f "$GITHUB_WORKSPACE/engine/notify.py" ]]; then
          cd "$GITHUB_WORKSPACE/engine"
          python3 notify.py fail "$REPO_NAME" "$ROM_LINK" "$ROM_PREFIX" "$BUILDER_NAME" "$BUILDER_ID" || true
        fi
        NEOM_PRIVATE_STAGE
      id: notify_fail
    - name: Send complete private log ZIP to Telegram
      id: deliver_logs
      if: ${{ always() }}
      timeout-minutes: 10
      continue-on-error: true
      env:
        NEOM_JOB_STEPS: ${{ toJSON(steps) }}
        NEOM_JOB_STATUS: ${{ job.status }}
        ENGINE_READ_TOKEN: ${{ secrets.ENGINE_READ_TOKEN }}
        RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
      run: |
        if [[ -f "${NEOM_CI_HELPER:-}" ]]; then
          sudo -E python3 "$NEOM_CI_HELPER" deliver "$GITHUB_WORKSPACE/engine" "$NEOM_JOB_STATUS"
        else
          python3 <<'PY'
        import io
        import json
        import os
        from pathlib import Path
        import re
        import sys
        import time
        import urllib.error
        import urllib.request
        import uuid
        import zipfile

        def request(method, body, content_type):
            for attempt in range(3):
                req = urllib.request.Request('https://api.telegram.org/bot' + token + '/' + method,
                    data=body, headers={'Content-Type': content_type})
                try:
                    with urllib.request.urlopen(req, timeout=60) as response:
                        result = json.loads(response.read())
                except urllib.error.HTTPError as error:
                    try:
                        result = json.loads(error.read())
                    except ValueError:
                        result = {'ok': False, 'error_code': error.code}
                except (OSError, ValueError):
                    result = {'ok': False, 'error_code': 0}
                if result.get('ok'):
                    return result['result']
                code = result.get('error_code', 0)
                if code not in (0, 429) and code < 500:
                    break
                if attempt < 2:
                    time.sleep(min(max(int(result.get('parameters', {}).get('retry_after', 2)), 1), 30))
            raise RuntimeError('Telegram bootstrap log delivery failed')

        try:
            token = os.environ.get('TELEGRAM_BOT_TOKEN', '')
            owner = os.environ.get('TELEGRAM_OWNER_ID', '')
            if not token or not re.fullmatch(r'[1-9][0-9]*', owner):
                raise ValueError('Bot token and positive personal owner ID are required')
            chat = request('getChat', json.dumps({'chat_id': owner}).encode(), 'application/json')
            if chat.get('type') != 'private' or str(chat.get('id')) != owner:
                raise ValueError('Log recipient must be the configured private owner chat')
            root = Path(os.environ['RUNNER_TEMP']) / 'neom-private-logs'
            path = root / 'bootstrap.log'
            detail = path.read_text(errors='replace') if path.is_file() else 'Logging initialization did not complete.\n'
            for name, value in os.environ.items():
                if value and name.endswith(('_TOKEN', '_SECRET', '_PASSWORD', '_CONFIG_B64')):
                    detail = detail.replace(value, '[REDACTED]')
            archive = io.BytesIO()
            with zipfile.ZipFile(archive, 'w', zipfile.ZIP_DEFLATED) as package:
                package.writestr('bootstrap.log', detail)
                package.writestr('summary.json', json.dumps({
                    'status': os.environ['NEOM_JOB_STATUS'],
                    'steps': json.loads(os.environ['NEOM_JOB_STEPS'])}, indent=2))
            boundary = 'neom_' + uuid.uuid4().hex
            body = bytearray()
            for name, value in {'chat_id': owner, 'caption': 'Neom initialization failed. Private diagnostics attached.'}.items():
                body.extend((f'--{boundary}\r\nContent-Disposition: form-data; name="{name}"\r\n\r\n{value}\r\n').encode())
            body.extend((f'--{boundary}\r\nContent-Disposition: form-data; name="document"; filename="Neom_Bootstrap_Logs.zip"\r\nContent-Type: application/zip\r\n\r\n').encode())
            body.extend(archive.getvalue())
            body.extend(f'\r\n--{boundary}--\r\n'.encode())
            request('sendDocument', bytes(body), 'multipart/form-data; boundary=' + boundary)
            print('Private initialization log ZIP delivered to your Telegram account.')
        except Exception as error:
            print('::warning::Private initialization log delivery failed:', type(error).__name__)
            sys.exit(1)
        PY
        fi
    - name: Remove temporary upload credentials
      if: always()
      run: |
        rm -f "$GITHUB_WORKSPACE/engine/rclone.conf"
      id: cleanup
    - name: Build summary
      if: always()
      run: |
        {
          echo "## Build result"
          echo "Detailed build, extraction, packing and upload logs are reserved for the owner on Telegram."
          echo "No detailed logs are printed or uploaded as GitHub artifacts."
          echo "Review the step outcomes above for the final result."
        } >> "$GITHUB_STEP_SUMMARY"
      id: summary
'on':
  workflow_dispatch:
    inputs:
      input_url:
        description: Direct HTTPS URL of the base ROM ZIP
        type: string
        required: true
      vendor_odm_url:
        description: Google Drive URL of vendor_odm.zip for sweet
        required: true
        type: string
